---
# vim:ff=unix ts=2 sw=2 ai expandtab
# code: language=ansible

# Mail transport agent package (e.g. postfix) that is installed before logwatch, so
# that apt does not pull in the distribution default (exim4 on Debian). Empty: do
# nothing, an already installed MTA is used, otherwise apt decides. The package is
# only installed, its configuration is not part of this role.
logwatch_mta: ''

# Packages to install. Add rsyslog on nodes without text logs (Debian trixie has only
# the journal), logwatch reads /var/log/*.
logwatch_packages: [logwatch]

# default is root
logwatch_mail_to: 'root'

# default is Logwatch
logwatch_mail_from: 'Logwatch'

# Ouptput: stdout, file, mail
logwatch_output: 'stdout'

# Format: text, html
logwatch_format: 'html'

# default is 'all'
logwatch_services: [all]

# specifiy service names without prepending a hyphen, default is []
logwatch_disabled_services: []

# valid ranges are: yesterday (yesterday), today, all
logwatch_range: 'yesterday'

# search through the archives, default is Yes
logwatch_archive: 'Yes'

# valid values are: Low, Med, High or a number (0 - 10), default is Low(0)
logwatch_detail: 'Low'

# Limit report to hosts
logwatch_limit_to_hosts: []

# Use hostname for the reports instead of this system's hostname.
logwatch_hostname: ''

# Number of characters that html output should be wrapped to. Default is 80.
logwatch_html_wrap: 80

# Inhibits additional name lookups, displaying IP addresses numerically.
logwatch_numeric: 'No'

# Bundled custom services (files/services/<name>/) to install, e.g. [restic].
logwatch_custom_services: []

# Per-service configuration overrides, written to /etc/logwatch/conf/services/<name>.conf.
# Each value is a list of lines. Example: the stock systemd service reads the log group
# "messages" (/var/log/messages), which does not exist on Debian with rsyslog:
#   logwatch_service_conf:
#     systemd: ['LogFile = syslog']
logwatch_service_conf: {}

# Per-logfile-group overrides, written to /etc/logwatch/conf/logfiles/<name>.conf (each
# value is a list of lines). Example: let the kernel service read the journal, because
# rsyslog does not receive kernel messages after boot on a VM:
#   logwatch_logfile_conf:
#     kernel:
#       - 'LogFile ='
#       - 'LogFile = /dev/null'
#       - '*JournalCtl = "--no-pager --output=short --dmesg"'
#       - '*ApplyStdDate'
logwatch_logfile_conf: {}

# Regular expressions for report lines that are dropped from every service (written to
# /etc/logwatch/conf/ignore.conf). They match the lines of the finished report, e.g.
# "Reload requested from client PID 123 ...: 1 Time(s)", not the raw log lines. Never add an
# empty entry, it would match every line. Single quotes in YAML keep the backslashes.
logwatch_ignore: []

# Yes: do not print the "N Ignored Lines" footer of the services whose lines are dropped by
# logwatch_ignore. Empty: logwatch default (print it).
logwatch_suppress_ignores: ''
